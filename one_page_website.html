<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>One Page Website</title>

    <style>
        body {
            font-family: 'Georgia', serif;
            font-size: 18px;
            margin: 0;
            line-height: 1.6;
        }

        h1 {
            font-size: 40px;
        }

        h2 {
            font-size: 30px;
        }

        nav {
            background-color: #333;
            padding: 10px;
            position: sticky;
            top: 0;
        }

        nav a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        section {
            padding: 40px;
        }

        img {
            width: 200px;
            margin: 10px;
        }

        form input, form textarea, form button {
            display: block;
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
            padding: 8px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 64px 24px 24px;
            background: rgba(0, 0, 0, 0.92);
            color: white;
        }

        .lightbox[hidden] {
            display: none;
        }

        .lightbox-figure {
            margin: 0;
            text-align: center;
        }

        .lightbox-image {
            display: block;
            width: auto;
            max-width: min(80vw, 1000px);
            max-height: 75vh;
            margin: 0 auto;
            object-fit: contain;
        }

        .lightbox-caption {
            margin-top: 12px;
        }

        .lightbox button {
            border: 0;
            padding: 8px 12px;
            background: transparent;
            color: white;
            font: inherit;
            font-size: 2rem;
            cursor: pointer;
        }

        .lightbox button:focus-visible {
            outline: 2px solid white;
            outline-offset: 4px;
        }

        .lightbox-close {
            position: absolute;
            top: 12px;
            right: 20px;
        }

        @media (max-width: 600px) {
            .lightbox {
                gap: 4px;
                padding: 56px 8px 16px;
            }

            .lightbox-image {
                max-width: 70vw;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation with bookmarks -->
    <nav>
        <a href="#home">Home</a>
        <a href="#gallery">Gallery</a>
        <a href="#contact">Contact</a>
        <a href="#videos">Videos</a>
        <a href="#footer">Footer</a>
    </nav>

    <!-- Home Section -->
    <section id="home">
        <h1>Welcome to My One-Page Website</h1>
        <p>
            This is a simple one-page HTML website that demonstrates navigation,
            images, a contact form, embedded videos, and a footer.
        </p>
    </section>

    <!-- Image Section -->
    <section id="gallery">
        <h2>Image Gallery</h2>

        <img src="https://loremflickr.com/200/140/cat" data-large-src="https://loremflickr.com/1200/800/cat" alt="Cat">
        <img src="https://loremflickr.com/200/140/lion" data-large-src="https://loremflickr.com/1200/800/lion" alt="Lion">
        <img src="https://loremflickr.com/200/140/crocodile" data-large-src="https://loremflickr.com/1200/800/crocodile" alt="Crocodile">
    </section>

    <!-- Contact Form Section -->
    <section id="contact">
        <h2>Contact Us</h2>

        <form>
            <input type="text" name="name" placeholder="Your Name" value="mofoluwaso" required>
            <input type="email" name="email" placeholder="Your Email" value="drfoluso@yahoo.com" required>
            <textarea name="message" rows="4" placeholder="Your Message">this is my one-page website</textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <!-- Video Section -->
    <section id="videos">
        <h2>Watch Our Video</h2>

        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
            title="YouTube video"
            frameborder="0"
            allowfullscreen>
        </iframe>
    </section>

    <!-- Footer -->
    <footer id="footer">
        <p>&copy; 2026 One Page Website. All rights reserved.</p>
    </footer>

    <script src="JS/one_page_website.js"></script>
</body>
</html>
